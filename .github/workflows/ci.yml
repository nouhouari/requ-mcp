name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    # PostgreSQL is how requ actually runs in production, and the SQLite suites
    # cannot stand in for it: they differ in JSONB round-tripping, in BIGSERIAL
    # ids coming back as strings, and in how strictly NOT NULL is enforced.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: requ_mcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke test (drives the built server over HTTP)
        run: npm run smoke

      - name: Smoke test — screens (UI specification traceability)
        run: npm run smoke:screens

      - name: Smoke test — VCS references
        run: npm run smoke:vcs

      - name: Smoke test — architecture decisions
        run: npm run smoke:adrs

      - name: Smoke test — scenario search
        run: npm run smoke:search

      - name: Smoke test — specification versions
        run: npm run smoke:versions

      - name: Smoke test — authentication, RBAC, 2FA and audit
        run: npm run smoke:auth

      - name: Smoke test — PostgreSQL backend
        run: npm run smoke:pg
        env:
          REQU_PG_URL: postgresql://postgres:postgres@localhost:5432/requ_mcp_test
