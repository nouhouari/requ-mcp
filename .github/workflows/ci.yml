name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Smoke test (drives the built server over HTTP)
        run: npm run smoke

      - name: Smoke test — screens (UI specification traceability)
        run: npm run smoke:screens

      - name: Smoke test — VCS references
        run: npm run smoke:vcs

      - name: Smoke test — architecture decisions
        run: npm run smoke:adrs

      - name: Smoke test — scenario search
        run: npm run smoke:search
