# requ-mcp — deployment with Docker Compose.
#
# Runs the published image (no build step) next to a Postgres database:
#
#   cd deploy
#   cp env.example .env         # set PG_PASSWORD and REQU_WORKSPACE_DIR
#   docker compose up -d
#   docker compose logs -f requ
#
# Upgrade:  docker compose pull && docker compose up -d
# Back up:  docker compose exec -T postgres pg_dump -U "$PG_USER" "$PG_DB" > requ.sql
# Restore:  docker compose exec -T postgres psql -U "$PG_USER" "$PG_DB" < requ.sql
#
# The MCP endpoint is http://<host>:8788/mcp and the dashboard http://<host>:8788/.
# By default the port is bound to 127.0.0.1 only — put a TLS-terminating reverse
# proxy in front of it, or set REQU_BIND=0.0.0.0 on a trusted network.
#
# For local development that builds from the sources, use ../docker-compose.yml.

name: requ

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-requ}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
      POSTGRES_DB: ${PG_DB:-requ}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published on the host. Uncomment to reach the database directly
    # (psql, backups from outside the container, smoke:pg).
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  requ:
    image: ${REQU_IMAGE:-ghcr.io/nouhouari/requ-mcp}:${REQU_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${REQU_BIND:-127.0.0.1}:${REQU_PORT:-8788}:8788"
    environment:
      REQU_HOST: 0.0.0.0
      REQU_PORT: 8788
      # The password must be URL-safe (letters, digits, - _ . ~) or percent-encoded.
      REQU_PG_URL: postgresql://${PG_USER:-requ}:${PG_PASSWORD}@postgres:5432/${PG_DB:-requ}
    volumes:
      # requ reads Conductor feature files, mockups and reports from its OWN
      # filesystem. Projects must record paths as the container sees them
      # (/workspace/<repo>/...). Read-only: requ never writes into your repos.
      - ${REQU_WORKSPACE_DIR:?set REQU_WORKSPACE_DIR to the directory holding your repos}:/workspace:ro
    # The image runs as the unprivileged `node` user and writes nothing when
    # Postgres is the store, so the root filesystem can be read-only.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    # The image ships its own HEALTHCHECK on GET /api/version; tightened here so
    # `docker compose ps` reflects a failed start quickly.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8788/api/version >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 15s
    logging: *logging

volumes:
  pgdata:
