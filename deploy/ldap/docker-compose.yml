# Throwaway OpenLDAP directory + phpLDAPadmin for exercising REQU_AUTH_MODE=ldap.
#
#   cp deploy/ldap/.env.example deploy/ldap/.env   # then set the two passwords
#   docker compose -f deploy/ldap/docker-compose.yml up -d
#
# The directory is seeded on FIRST start only (bootstrap/*.ldif); to reseed,
# `down -v` and `up -d` again. Not for production: plaintext LDAP is exposed
# and the LDAPS certificate is self-signed.
services:
  ldap:
    image: osixia/openldap:1.5.0
    container_name: requ-ldap
    restart: unless-stopped
    ports:
      - "${LDAP_PORT:-3389}:389"
      - "${LDAPS_PORT:-3636}:636"
    environment:
      LDAP_ORGANISATION: ${LDAP_ORGANISATION:-Example}
      LDAP_DOMAIN: ${LDAP_DOMAIN:-example.com}
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:?set LDAP_ADMIN_PASSWORD in deploy/ldap/.env}
      # The image creates this account and grants it read access; requ binds
      # with it as REQU_LDAP_BIND_DN=cn=requ-service,<base dn>.
      LDAP_READONLY_USER: "true"
      LDAP_READONLY_USER_USERNAME: ${LDAP_SERVICE_USERNAME:-requ-service}
      LDAP_READONLY_USER_PASSWORD: ${LDAP_SERVICE_PASSWORD:?set LDAP_SERVICE_PASSWORD in deploy/ldap/.env}
      LDAP_TLS_VERIFY_CLIENT: never
      # Custom LDIFs are copied from here and applied after the image's own bootstrap.
      LDAP_SEED_INTERNAL_LDIF_PATH: /bootstrap
    volumes:
      - ./bootstrap:/bootstrap:ro
      - ldap-data:/var/lib/ldap
      - ldap-config:/etc/ldap/slapd.d
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost -b '' -s base >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20

  ldap-admin:
    image: osixia/phpldapadmin:0.9.0
    container_name: requ-ldap-admin
    restart: unless-stopped
    depends_on:
      ldap:
        condition: service_healthy
    ports:
      - "${LDAP_ADMIN_PORT:-8389}:80"
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: ldap
      PHPLDAPADMIN_HTTPS: "false"

volumes:
  ldap-data:
  ldap-config:
