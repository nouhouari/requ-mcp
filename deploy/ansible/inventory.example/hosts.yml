# Copy inventory.example/ to inventory/ (git-ignored) and fill it in.
#
# With `-e provision=true` the provision play adds the host itself and this
# file only needs the group to exist. For a VM you created by hand, name it
# here with the address Ansible reaches it on, the private address requ binds,
# and the block device of the attached data volume.
all:
  children:
    requ:
      hosts:
        requ-01:
          ansible_host: 10.0.0.10
          ansible_user: ubuntu
          # Private address the reverse proxy connects to (never 127.0.0.1).
          requ_bind_ip: 10.0.0.10
          # The attached OpenStack volume, by stable id.
          requ_data_device: /dev/disk/by-id/virtio-0123456789abcdef0123
