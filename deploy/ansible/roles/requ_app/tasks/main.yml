---
- name: Check the configuration before touching the host
  ansible.builtin.import_tasks: assert.yml
- name: Build the image on the host
  ansible.builtin.import_tasks: image_build.yml
  when: requ_image_build | bool
- name: Render and apply the stack
  ansible.builtin.import_tasks: deploy.yml
- name: Report
  ansible.builtin.import_tasks: verify.yml
