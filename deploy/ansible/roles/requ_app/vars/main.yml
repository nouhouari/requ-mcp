---
# Application environment, in the order the README documents it. Empty values
# are dropped by the template; the server treats a missing variable and an
# empty one the same way.
requ_env_base:
  REQU_AUTH_MODE: "{{ requ_auth_mode }}"
  REQU_AUTH_SECRET: "{{ requ_auth_secret }}"
  REQU_AUTH_ADMINS: "{{ requ_auth_admins | join(',') }}"
  REQU_AUTH_DEFAULT_ROLE: "{{ requ_auth_default_role }}"
  REQU_AUTH_SESSION_TTL_HOURS: "{{ requ_auth_session_ttl_hours }}"
  REQU_AUTH_TOKEN_TTL_DAYS: "{{ requ_auth_token_ttl_days }}"
  REQU_AUDIT: "{{ requ_audit }}"
  REQU_TRUSTED_PROXIES: "{{ requ_trusted_proxies | join(',') }}"
  REQU_CORS_ORIGINS: "{{ requ_cors_origins | join(',') }}"
  REQU_LDAP_URL: "{{ requ_ldap_url }}"
  REQU_LDAP_BASE_DN: "{{ requ_ldap_base_dn }}"
  REQU_LDAP_BIND_DN: "{{ requ_ldap_bind_dn }}"
  REQU_LDAP_BIND_PASSWORD: "{{ requ_ldap_bind_password }}"
  REQU_LDAP_USER_FILTER: "{{ requ_ldap_user_filter }}"
  REQU_LDAP_USER_DN_TEMPLATE: "{{ requ_ldap_user_dn_template }}"
  REQU_LDAP_GROUP_BASE_DN: "{{ requ_ldap_group_base_dn }}"
  REQU_LDAP_GROUP_FILTER: "{{ requ_ldap_group_filter }}"
  REQU_LDAP_GROUP_ATTR: "{{ requ_ldap_group_attr }}"
  REQU_LDAP_MEMBEROF_ATTR: "{{ requ_ldap_memberof_attr }}"
  REQU_LDAP_TIMEOUT_MS: "{{ requ_ldap_timeout_ms }}"
  REQU_LDAP_ROLE_MAP: "{{ requ_ldap_role_map.items() | map('join', '=') | join(';') }}"
  REQU_LDAP_TLS_REJECT_UNAUTHORIZED: "{{ requ_ldap_tls_reject_unauthorized | bool | string | lower }}"
  REQU_LDAP_ALLOW_PLAINTEXT: "{{ 'true' if (requ_ldap_allow_plaintext | bool) else '' }}"
  REQU_2FA: "{{ requ_2fa }}"
  REQU_2FA_REQUIRED_ROLES: "{{ requ_2fa_required_roles | join(',') }}"
  REQU_2FA_ISSUER: "{{ requ_2fa_issuer }}"
requ_env_map: "{{ requ_env_base | combine(requ_extra_env) }}"
requ_app_dir: "{{ requ_data_mount }}/app"
requ_src_dir: "{{ requ_data_mount }}/src"
requ_ldap_ca_present: "{{ (requ_ldap_ca_cert_src | length > 0) or (requ_ldap_ca_cert_pem | length > 0) }}"
