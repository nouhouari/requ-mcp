services:
  postgres:
    image: postgres:16-alpine
    container_name: requ-mcp-pg
    restart: unless-stopped
    ports:
      - "${PG_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${PG_USER:?set PG_USER in .env}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?set PG_PASSWORD in .env}
      POSTGRES_DB: ${PG_DB:?set PG_DB in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 5

  requ-mcp:
    build:
      context: .
      dockerfile: Dockerfile.requ
    image: requ-mcp:local
    container_name: requ-mcp-http
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${REQU_PORT:-8788}:8788"
    environment:
      REQU_HOST: 0.0.0.0
      REQU_PORT: 8788
      REQU_PG_URL: postgresql://${PG_USER}:${PG_PASSWORD}@postgres:5432/${PG_DB}
      # Authentication. Defaults to 'disabled' so a fresh clone comes up without
      # a directory; set REQU_AUTH_MODE=ldap in .env for a real deployment and
      # the LDAP_* settings below become required. See .env.example.
      REQU_AUTH_MODE: ${REQU_AUTH_MODE:-disabled}
      REQU_AUTH_SECRET: ${REQU_AUTH_SECRET:-}
      REQU_AUDIT: ${REQU_AUDIT:-auto}
      REQU_AUTH_DEFAULT_ROLE: ${REQU_AUTH_DEFAULT_ROLE:-viewer}
      REQU_AUTH_ADMINS: ${REQU_AUTH_ADMINS:-}
      REQU_AUTH_SESSION_TTL_HOURS: ${REQU_AUTH_SESSION_TTL_HOURS:-12}
      REQU_AUTH_TOKEN_TTL_DAYS: ${REQU_AUTH_TOKEN_TTL_DAYS:-0}
      # Peers whose X-Forwarded-For is believed (the reverse proxy in front of
      # requ). Leave empty when requ is reached directly.
      REQU_TRUSTED_PROXIES: ${REQU_TRUSTED_PROXIES:-}
      # Browser origins allowed to call the REST API cross-origin. Empty (the
      # default) sends no CORS headers at all; the dashboard is same-origin.
      REQU_CORS_ORIGINS: ${REQU_CORS_ORIGINS:-}
      REQU_LDAP_URL: ${REQU_LDAP_URL:-}
      REQU_LDAP_BASE_DN: ${REQU_LDAP_BASE_DN:-}
      REQU_LDAP_BIND_DN: ${REQU_LDAP_BIND_DN:-}
      REQU_LDAP_BIND_PASSWORD: ${REQU_LDAP_BIND_PASSWORD:-}
      REQU_LDAP_USER_FILTER: ${REQU_LDAP_USER_FILTER:-}
      REQU_LDAP_USER_DN_TEMPLATE: ${REQU_LDAP_USER_DN_TEMPLATE:-}
      REQU_LDAP_MEMBEROF_ATTR: ${REQU_LDAP_MEMBEROF_ATTR:-}
      REQU_LDAP_GROUP_BASE_DN: ${REQU_LDAP_GROUP_BASE_DN:-}
      REQU_LDAP_GROUP_FILTER: ${REQU_LDAP_GROUP_FILTER:-}
      REQU_LDAP_GROUP_ATTR: ${REQU_LDAP_GROUP_ATTR:-}
      REQU_LDAP_ROLE_MAP: ${REQU_LDAP_ROLE_MAP:-}
      REQU_LDAP_TLS_REJECT_UNAUTHORIZED: ${REQU_LDAP_TLS_REJECT_UNAUTHORIZED:-true}
      REQU_LDAP_ALLOW_PLAINTEXT: ${REQU_LDAP_ALLOW_PLAINTEXT:-}
      REQU_2FA: ${REQU_2FA:-off}
      REQU_2FA_REQUIRED_ROLES: ${REQU_2FA_REQUIRED_ROLES:-}
      REQU_2FA_ISSUER: ${REQU_2FA_ISSUER:-}
    volumes:
      # requ-mcp reads Conductor feature files, mockups and reports from its OWN
      # filesystem. Without this the server cannot see any project's files and
      # every path-based tool fails. Projects must store paths as the CONTAINER
      # sees them (/workspace/...), not host paths. Read-only: requ never writes
      # back into your repos.
      - ${REQU_WORKSPACE_DIR:?set REQU_WORKSPACE_DIR to the directory holding your repos}:/workspace:ro

volumes:
  pgdata:
